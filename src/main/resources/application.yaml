spring:
  application:
    name: order-service
  profiles:
    active: dev
  config:
    import: "optional:configserver:${CONFIG_SERVER_URL:http://localhost:8888}"

server:
  port: 8082

---
spring:
  config:
    activate:
      on-profile: stage
    import: "configserver:${CONFIG_SERVER_URL}"

---
spring:
  config:
    activate:
      on-profile: prod
    import: "configserver:${CONFIG_SERVER_URL}"